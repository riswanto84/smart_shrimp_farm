{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{% if asset %}Edit{% else %}Tambah{% endif %} Aset Tetap</h1>
    <p>Nilai aset otomatis menggunakan format Rupiah dengan tanda titik sebagai pemisah ribuan.</p>
  </div>
</div>
<form method="post" class="cardx row g-3">
  {% csrf_token %}
  <div class="col-md-3"><label class="form-label">Kode aset</label><input required name="code" value="{{ asset.code|default:'' }}" class="form-control"></div>
  <div class="col-md-5"><label class="form-label">Nama aset</label><input required name="name" value="{{ asset.name|default:'' }}" class="form-control"></div>
  <div class="col-md-4"><label class="form-label">Kategori</label><input required name="category" value="{{ asset.category|default:'' }}" placeholder="Kincir, Pompa, Genset..." class="form-control"></div>

  <div class="col-md-3"><label class="form-label">Tanggal pembelian</label><input required type="date" name="acquisition_date" value="{{ asset.acquisition_date|date:'Y-m-d' }}" class="form-control"></div>
  <div class="col-md-3"><label class="form-label">Tanggal mulai digunakan</label><input required type="date" name="use_date" value="{{ asset.use_date|date:'Y-m-d' }}" class="form-control"></div>

  <div class="col-md-3">
    <label class="form-label">Harga perolehan</label>
    <div class="input-group">
      <span class="input-group-text">Rp</span>
      <input required name="acquisition_cost" value="{% if asset %}{{ asset.acquisition_cost|floatformat:0 }}{% else %}0{% endif %}" class="form-control rupiah-input" data-rupiah-input inputmode="numeric" autocomplete="off">
    </div>
    <div class="form-text">Contoh: 675.000.000</div>
  </div>
  <div class="col-md-3">
    <label class="form-label">Biaya tambahan</label>
    <div class="input-group">
      <span class="input-group-text">Rp</span>
      <input name="additional_cost" value="{% if asset %}{{ asset.additional_cost|floatformat:0 }}{% else %}0{% endif %}" class="form-control rupiah-input" data-rupiah-input inputmode="numeric" autocomplete="off">
    </div>
  </div>
  <div class="col-md-3">
    <label class="form-label">Nilai residu</label>
    <div class="input-group">
      <span class="input-group-text">Rp</span>
      <input name="residual_value" value="{% if asset %}{{ asset.residual_value|floatformat:0 }}{% else %}0{% endif %}" class="form-control rupiah-input" data-rupiah-input inputmode="numeric" autocomplete="off">
    </div>
  </div>
  <div class="col-md-3"><label class="form-label">Masa manfaat komersial (tahun)</label><input type="number" min="1" name="commercial_useful_life_years" value="{{ asset.commercial_useful_life_years|default:'4' }}" class="form-control"></div>

  <div class="col-md-3"><label class="form-label">Kelompok fiskal</label><select name="fiscal_group" class="form-select">{% for v,l in groups %}<option value="{{ v }}" {% if asset.fiscal_group == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label">Status</label><select name="status" class="form-select">{% for v,l in statuses %}<option value="{{ v }}" {% if asset.status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label">Lokasi</label><input name="location" value="{{ asset.location|default:'' }}" class="form-control"></div>
  <div class="col-md-4"><label class="form-label">Nomor bukti/faktur</label><input name="document_number" value="{{ asset.document_number|default:'' }}" class="form-control"></div>
  <div class="col-md-4"><label class="form-label">Sumber dana</label><input name="source_of_funds" value="{{ asset.source_of_funds|default:'' }}" class="form-control"></div>
  <div class="col-12"><label class="form-label">Catatan</label><textarea name="notes" class="form-control">{{ asset.notes|default:'' }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Simpan</button></div>
</form>
{% endblock %}
